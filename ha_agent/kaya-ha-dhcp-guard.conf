# Managed by Kaya HA (revised DHCP protocol).  Installed as zz-kaya-ha-dhcp-guard.conf so that it is
# read after any other pihole-FTL drop-in.
#
# Before every Pi-hole FTL start (boot, crash restart or manual restart) Kaya's helper decides DHCP:
#  * same boot, this node still holds Kaya's DHCP grant and the Virtual IP: DHCP is left as it is;
#  * otherwise DHCP is turned off in pihole.toml (verified) and the local grant is voided, so only
#    a fresh grant from Kaya, after verified release of the other node, starts DHCP again;
#  * if pihole.toml cannot be made safe (read-only, failed write, or dhcp.active set by this unit's
#    environment) the helper writes the file below, which forces dhcp.active=false through FTL's
#    environment: FTL starts DNS-only;
#  * exit code 3: the helper could not confirm DHCP is off, so FTL is not started;
#  * the helper is missing or fails for any other reason (broken install or removal): this drop-in
#    writes the same file itself, so FTL still starts DNS-only and never serves DHCP unverified;
#  * an older agent's helper (no boot guard, after an agent rollback): this drop-in steps aside and
#    pihole.toml decides, exactly as before the revised protocol was installed.
[Service]
ExecStartPre=+/bin/sh -c 'H=/usr/lib/kaya-ha-agent/kaya_ha_failover_helper.py; E=/run/kaya-ha-dhcp-guard/ftl.env; if [ -f "$$H" ] && ! grep -q "boot-guard" "$$H"; then rm -f "$$E"; echo "kaya-ha: older agent without the boot guard; pihole.toml decides DHCP"; exit 0; fi; "$$H" boot-guard; rc=$$?; [ "$$rc" -eq 0 ] && exit 0; [ "$$rc" -eq 3 ] && exit 1; mkdir -p -m 0755 /run/kaya-ha-dhcp-guard && { echo FTLCONF_dhcp_active=false; echo KAYA_HA_DHCP_GUARD=dns-only; } > "$$E" && grep -qx FTLCONF_dhcp_active=false "$$E" && echo "kaya-ha boot guard unavailable (exit $$rc): FTL starts DNS-only"'
# Read after ExecStartPre finishes; overrides Environment= and earlier EnvironmentFile= settings.
EnvironmentFile=-/run/kaya-ha-dhcp-guard/ftl.env
