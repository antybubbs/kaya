services:
  # Explicit legacy upgrade runner. Do not include this file for normal startup.
  sqlite-postgres-upgrade:
    image: ${KAYA_IMAGE:-ghcr.io/antybubbs/kaya:latest}
    restart: "no"
    environment:
      DATABASE_URL: postgresql+psycopg://kaya@postgres:5432/kaya
      KAYA_POSTGRES_DATABASE_URL: postgresql+psycopg://kaya@postgres:5432/kaya
      DATABASE_PASSWORD_FILE: /run/kaya-secrets/postgres_password
      KAYA_SQLITE_SOURCE_URL: sqlite:////app/data/kaya.db
      PGHOST: postgres
    entrypoint: ["python", "-m", "scripts.kaya_phase6_upgrade"]
    command:
      - --source
      - /app/data/kaya.db
      - --target-url
      - postgresql+psycopg://kaya@postgres:5432/kaya
      - --backup-dir
      - /app/data/backups
      - --data-dir
      - /app/data
    volumes:
      - ${KAYA_DATA_DIR:-./data}:/app/data
      - kaya_upgrade_secrets:/run/kaya-secrets:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres-secret-init:
    image: ${KAYA_IMAGE:-ghcr.io/antybubbs/kaya:latest}
    restart: "no"
    entrypoint: ["python"]
    command:
      - -c
      - >-
        import os,secrets;
        path='/run/kaya-secrets/postgres_password';
        os.umask(0o077);
        open(path,'xb').write(open('/run/kaya-host-secrets/postgres_password','rb').read() if os.path.isfile('/run/kaya-host-secrets/postgres_password') else secrets.token_urlsafe(64).encode()) if not os.path.exists(path) else None;
        os.chown(path,100,101);os.chmod(path,0o600)
    volumes:
      - kaya_upgrade_secrets:/run/kaya-secrets
      - ${KAYA_POSTGRES_PASSWORD_DIR:-./data/secrets}:/run/kaya-host-secrets:ro

  postgres:
    environment:
      POSTGRES_PASSWORD_FILE: /run/kaya-secrets/postgres_password
    volumes:
      - kaya_upgrade_secrets:/run/kaya-secrets:ro
    depends_on:
      postgres-secret-init:
        condition: service_completed_successfully

volumes:
  kaya_upgrade_secrets:
    name: kaya_upgrade_secrets
