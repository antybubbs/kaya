name: Phase 12 PostgreSQL Role Topology Migration Validation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/phase12-runtime.yml'
      - 'docker-compose.yml'
      - 'docker-compose.phase12-ci.yml'
      - 'docker-compose.phase12-legacy-ci.yml'
      - 'scripts/kaya_postgres_role_topology.py'
      - 'scripts/kaya_postgres_backup_worker.sh'
      - 'scripts/phase12_*.py'
      - 'scripts/phase12_*.sh'
      - 'tests/test_postgres_deployment.py'
      - 'docs/deployment.md'
  pull_request:
    paths:
      - '.github/workflows/phase12-runtime.yml'
      - 'docker-compose.yml'
      - 'docker-compose.phase12-ci.yml'
      - 'docker-compose.phase12-legacy-ci.yml'
      - 'scripts/kaya_postgres_role_topology.py'
      - 'scripts/kaya_postgres_backup_worker.sh'
      - 'scripts/phase12_*.py'
      - 'scripts/phase12_*.sh'
      - 'tests/test_postgres_deployment.py'
      - 'docs/deployment.md'

jobs:
  role-topology:
    name: Disposable Phase 12 role-topology migration matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PHASE12_PROJECT: kaya_phase12_${{ github.run_id }}_${{ github.run_attempt }}
      PHASE12_ROOT: ./phase12-data
      PHASE12_POSTGRES_IMAGE: postgres:16.14
      PHASE12_APP_IMAGE: kaya:phase12-${{ github.sha }}
      PHASE12_HTTP_PORT: 18132
    steps:
      - uses: actions/checkout@v4
      - name: Build disposable application image
        run: docker build --file Dockerfile --tag "$PHASE12_APP_IMAGE" .
      - name: Run Phase 12 validation
        run: bash scripts/phase12_runtime_validation.sh
      - name: Upload redacted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase12-role-topology-evidence
          path: |
            phase12_acceptance.json
            phase12_role_migration_evidence.json
          if-no-files-found: error
      - name: Dispose exact Phase 12 resources
        if: always()
        run: |
          docker compose -p "$PHASE12_PROJECT" -f docker-compose.yml -f docker-compose.phase12-ci.yml -f docker-compose.phase12-legacy-ci.yml down || true
          if [ -f phase12_resources.json ]; then
            python scripts/kaya_validation_resources.py cleanup --manifest phase12_resources.json
          fi
          python scripts/kaya_validation_resources.py cleanup-compose --project "$PHASE12_PROJECT" || true
