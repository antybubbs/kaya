name: Phase 11 PostgreSQL Upgrade Readiness Validation

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/phase11-runtime.yml"
      - "docker-compose.yml"
      - "docker-compose.phase7d-ci.yml"
      - "docker-compose.phase11-ci.yml"
      - "scripts/phase11_*.py"
      - "scripts/phase11_*.sh"
      - "scripts/kaya_postgres_backup_worker.sh"
      - "scripts/kaya_postgres_upgrade.py"
      - "app/db/platform_compatibility.py"
      - "app/db/postgres_upgrade.py"
      - "app/services/postgres_diagnostics.py"
      - "tests/test_phase10_platform.py"
      - "tests/test_postgres_upgrade.py"
      - "tests/test_postgres_operations.py"
      - "docs/postgresql-*.md"
      - "docs/database-platform-policy.md"
  pull_request:
    paths:
      - ".github/workflows/phase11-runtime.yml"
      - "docker-compose.yml"
      - "docker-compose.phase7d-ci.yml"
      - "docker-compose.phase11-ci.yml"
      - "scripts/phase11_*.py"
      - "scripts/phase11_*.sh"
      - "scripts/kaya_postgres_backup_worker.sh"
      - "scripts/kaya_postgres_upgrade.py"
      - "app/db/platform_compatibility.py"
      - "app/db/postgres_upgrade.py"
      - "app/services/postgres_diagnostics.py"
      - "tests/test_phase10_platform.py"
      - "tests/test_postgres_upgrade.py"
      - "tests/test_postgres_operations.py"
      - "docs/postgresql-*.md"
      - "docs/database-platform-policy.md"

jobs:
  upgrade-readiness:
    name: Disposable Phase 11 PostgreSQL patch-upgrade matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PHASE11_PROJECT: kaya_phase11_${{ github.run_id }}_${{ github.run_attempt }}
      PHASE11_ROOT: ./phase11-data
      PHASE11_PORT: 18120
      PHASE11_SOURCE_IMAGE: postgres:16.13
      PHASE11_TARGET_IMAGE: postgres:16.14
      PHASE11_APP_IMAGE: kaya:phase11-${{ github.sha }}
      PHASE11_TEST_IMAGE: kaya:phase11-tests-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify selected PostgreSQL image tags
        run: |
          docker manifest inspect "$PHASE11_SOURCE_IMAGE" >/dev/null
          docker manifest inspect "$PHASE11_TARGET_IMAGE" >/dev/null
          test "$PHASE11_SOURCE_IMAGE" != "$PHASE11_TARGET_IMAGE"
      - name: Build disposable images
        run: |
          docker build --file Dockerfile --tag "$PHASE11_APP_IMAGE" .
          docker build --file Dockerfile.test --tag "$PHASE11_TEST_IMAGE" .
      - name: Validate PostgreSQL upgrade readiness matrix
        run: bash scripts/phase11_runtime_validation.sh
      - name: Publish redacted Phase 11 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase11-upgrade-readiness-evidence
          path: |
            phase11_acceptance.json
            phase11_upgrade_evidence.json
          if-no-files-found: warn
      - name: Dispose exact Phase 11 resources
        if: always()
        run: |
          PHASE11_PROJECT="$PHASE11_PROJECT" \
          PHASE11_ROOT=./phase11-data \
          PHASE11_POSTGRES_IMAGE="$PHASE11_TARGET_IMAGE" \
          PHASE7D_PROJECT="$PHASE11_PROJECT" \
          PHASE7D_ROOT=./phase11-data \
          PHASE7D_IMAGE="$PHASE11_APP_IMAGE" \
          PHASE7D_HTTP_PORT=18120 \
          PHASE7D_GATEWAY_PORT=18220 \
          docker compose -p "$PHASE11_PROJECT" \
            -f docker-compose.yml -f docker-compose.phase7d-ci.yml -f docker-compose.phase11-ci.yml \
            down -v --remove-orphans
