name: Phase 13 PostgreSQL Production Rollout Readiness
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/phase13-runtime.yml
      - docker-compose.yml
      - docker-compose.phase7d-ci.yml
      - scripts/phase7d_runtime_validation.sh
      - scripts/phase12_runtime_validation.sh
      - scripts/phase13_runtime_validation.sh
      - scripts/phase13_acceptance_evidence.py
      - docs/deployment.md
  pull_request:
    paths:
      - .github/workflows/phase13-runtime.yml
      - docker-compose.yml
      - docker-compose.phase7d-ci.yml
      - scripts/phase7d_runtime_validation.sh
      - scripts/phase12_runtime_validation.sh
      - scripts/phase13_runtime_validation.sh
      - scripts/phase13_acceptance_evidence.py
      - docs/deployment.md
jobs:
  production-readiness:
    runs-on: ubuntu-latest
    env:
      PHASE13_PROJECT: kaya_phase13_${{ github.run_id }}_${{ github.run_attempt }}
      PHASE13_ROOT: ${{ runner.temp }}/kaya-phase13-${{ github.run_id }}-${{ github.run_attempt }}
      PHASE13_APP_IMAGE: kaya-phase13-app:${{ github.sha }}
      PHASE13_TEST_IMAGE: kaya-phase13-test:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t "$PHASE13_APP_IMAGE" -f Dockerfile .
      - run: docker build -t "$PHASE13_TEST_IMAGE" -f Dockerfile.test .
      - run: bash scripts/phase13_runtime_validation.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase13-production-readiness-${{ github.run_id }}
          path: |
            phase13_acceptance.json
            phase13_upgrade_evidence.json
            phase12_acceptance.json
            phase12_role_migration_evidence.json
          if-no-files-found: warn
      - if: always()
        run: |
          python scripts/kaya_validation_resources.py cleanup-compose --project "$PHASE13_PROJECT" || true
          python scripts/kaya_validation_resources.py cleanup-compose --project "kaya_phase12_13_${GITHUB_RUN_ID}" || true
