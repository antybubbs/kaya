name: Database Integration

on:
  workflow_dispatch:
  push:
    branches: [main, dev, Kaya]
    paths:
      - ".github/workflows/database.yml"
      - "app/**"
      - "migrations/**"
      - "scripts/**"
      - "tests/**"
      - "docker-compose.yml"
      - "ci/compose/**"
      - "Dockerfile"
      - "Dockerfile.test"
  pull_request:
    paths:
      - ".github/workflows/database.yml"
      - "app/**"
      - "migrations/**"
      - "scripts/**"
      - "tests/**"
      - "docker-compose.yml"
      - "ci/compose/**"
      - "Dockerfile"
      - "Dockerfile.test"

permissions:
  contents: read

jobs:
  postgresql:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: phase8-ci-only-secret-key-012345678901234567890123456789
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_DB: kaya_test
          POSTGRES_USER: kaya_test
          POSTGRES_PASSWORD: kaya_test_only
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U kaya_test -d kaya_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare disposable container path defaults
        run: |
          sudo mkdir -p /app/data/remote-recordings /app/uploads
          sudo chown -R "$USER:$USER" /app
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Verify synthetic CI configuration
        run: python -c "import os; assert len(os.environ['SECRET_KEY']) >= 32"
      - name: PostgreSQL schema and invariant regression tests
        env:
          KAYA_TEST_POSTGRES_URL: postgresql+psycopg://kaya_test:kaya_test_only@127.0.0.1:55432/kaya_test
        run: python -m pytest -q tests/test_postgresql_schema_validation.py tests/test_database_engine_compatibility.py

  runtime:
    name: PostgreSQL runtime and recovery validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install smoke-test dependencies
        run: python -m pip install --upgrade pip

      - name: Validate primary Compose configuration
        run: docker compose -f docker-compose.yml config --quiet

      - name: Run isolated PostgreSQL runtime matrix
        run: bash scripts/phase7d_runtime_validation.sh

      - name: Upload redacted runtime evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: postgresql-runtime-evidence-${{ github.run_id }}
          path: /tmp/kaya-phase7d-*/logs/
          if-no-files-found: ignore
          retention-days: 14

  lifecycle:
    name: SQLite upgrade and failed-migration validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PHASE9_PROJECT: kaya_phase9_${{ github.run_id }}_${{ github.run_attempt }}
      PHASE9_ROOT: ./phase9-data
      PHASE9_PORT: 18100
      PHASE9_IMAGE: kaya:phase9-${{ github.sha }}
      PHASE9_TEST_IMAGE: kaya:phase9-tests-${{ github.sha }}
      PHASE7D_PROJECT: kaya_phase9_${{ github.run_id }}_${{ github.run_attempt }}
      PHASE7D_ROOT: ./phase9-data
      PHASE7D_IMAGE: kaya:phase9-${{ github.sha }}
      PHASE7D_HTTP_PORT: 18100
      PHASE7D_GATEWAY_PORT: 18200
    steps:
      - uses: actions/checkout@v4
      - name: Build disposable images
        run: |
          docker build --file Dockerfile --tag "$PHASE9_IMAGE" .
          docker build --file Dockerfile.test --tag "$PHASE9_TEST_IMAGE" .
      - name: Validate SQLite upgrade lifecycle matrix
        run: bash scripts/phase9_runtime_validation.sh
      - name: Publish redacted SQLite upgrade evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-upgrade-evidence
          path: |
            phase9_acceptance.json
            phase9-summary.tsv
            phase9-duration.tsv
          if-no-files-found: warn
      - name: Dispose exact SQLite upgrade resources
        if: always()
        run: |
          docker compose -p "${PHASE9_PROJECT}" -f docker-compose.yml -f ci/compose/docker-compose.phase7d-ci.yml down --remove-orphans
          python scripts/kaya_validation_resources.py cleanup-compose --project "${PHASE9_PROJECT}"
