name: CI

on:
  push:
    branches: [main, dev, Kaya]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key-012345678901234567890123456789
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.11"
      - name: Materialize pinned Docker agent dependency
        run: |
          git clone --no-checkout https://github.com/antybubbs/Kaya-Docker-Agent.git external/Kaya-Docker-Agent
          git -C external/Kaya-Docker-Agent fetch --depth 1 origin 62a2352c2fbb4588652159db984fa5b6fed9d652
          git -C external/Kaya-Docker-Agent checkout --detach 62a2352c2fbb4588652159db984fa5b6fed9d652
      - name: Prepare disposable container path defaults
        run: |
          sudo mkdir -p /app/data/remote-recordings /app/uploads
          sudo chown -R "$USER:$USER" /app
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest ruff
      - name: Compose configuration
        run: docker compose -f docker-compose.yml config --quiet
      - name: Verify synthetic CI configuration
        run: python -c "import os; assert len(os.environ['SECRET_KEY']) >= 32"
      - name: Unit and regression tests
        # Docker integration runs in the dedicated database workflow; do not
        # attempt to nest Docker inside this Python test job.
        run: python -m pytest -q --ignore=tests/test_sqlite_temp_exhaustion_docker.py
      - name: Ruff
        run: ruff check .
      - name: Diff whitespace
        run: git diff --check

  postgresql:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key-012345678901234567890123456789
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_DB: kaya_test
          POSTGRES_USER: kaya_test
          POSTGRES_PASSWORD: kaya_test_only
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U kaya_test -d kaya_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.11"
      - name: Prepare disposable container path defaults
        run: |
          sudo mkdir -p /app/data/remote-recordings /app/uploads
          sudo chown -R "$USER:$USER" /app
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Verify synthetic CI configuration
        run: python -c "import os; assert len(os.environ['SECRET_KEY']) >= 32"
      - name: PostgreSQL schema and invariant regression tests
        env:
          KAYA_TEST_POSTGRES_URL: postgresql+psycopg://kaya_test:kaya_test_only@127.0.0.1:55432/kaya_test
        run: python -m pytest -q tests/test_postgresql_schema_validation.py tests/test_database_engine_compatibility.py
