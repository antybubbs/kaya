name: RC Release Readiness

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character candidate commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve-candidate:
    name: Resolve exact RC candidate
    runs-on: ubuntu-latest
    outputs:
      candidate_sha: ${{ steps.resolve.outputs.candidate_sha }}
    steps:
      - name: Resolve candidate SHA
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_SHA: ${{ github.sha }}
          INPUT_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -Eeuo pipefail
          if [[ "$EVENT_NAME" == push ]]; then
            candidate_sha="$PUSH_SHA"
          elif [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            candidate_sha="$INPUT_SHA"
          else
            echo "Unsupported trigger: $EVENT_NAME" >&2
            exit 1
          fi
          [[ "$candidate_sha" =~ ^[0-9a-fA-F]{40}$ ]]
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"

      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.candidate_sha }}
          fetch-depth: 0
      - name: Verify candidate is on dev
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.resolve.outputs.candidate_sha }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin dev
          git cat-file -e "$CANDIDATE_SHA^{commit}"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor "$CANDIDATE_SHA" origin/dev

  runtime-gate:
    name: Tier A - Runtime Release Gate
    needs: resolve-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CANDIDATE_SHA: ${{ needs.resolve-candidate.outputs.candidate_sha }}
      PHASE7D_HISTORICAL_REVISION: 20260813_01
      PHASE7D_PROJECT_PREFIX: kaya_phase7d_${{ github.run_id }}_${{ github.run_attempt }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-candidate.outputs.candidate_sha }}
          fetch-depth: 0
      - name: Verify checked-out candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch --no-tags origin dev
          git merge-base --is-ancestor "$CANDIDATE_SHA" origin/dev
      - name: Validate Compose configuration
        run: docker compose -f docker-compose.yml config --quiet
      - name: Run strict Docker runtime acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          export GITHUB_SHA="$CANDIDATE_SHA"
          bash scripts/phase7d_runtime_validation.sh

  extended-harness:
    name: Tier B - Extended Test and Harness Gate
    needs: resolve-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CANDIDATE_SHA: ${{ needs.resolve-candidate.outputs.candidate_sha }}
      TEST_IMAGE: kaya-rc-harness:${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      phase6_result: ${{ steps.phase6.outputs.result }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-candidate.outputs.candidate_sha }}
          fetch-depth: 0
      - name: Verify checked-out candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch --no-tags origin dev
          git merge-base --is-ancestor "$CANDIDATE_SHA" origin/dev
      - name: Static checks
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check ruff
          ruff check .
          python -m compileall -q app scripts
          while IFS= read -r -d '' script; do bash -n "$script"; done < <(find . -type f -name '*.sh' -print0)
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.upgrade.yml config --quiet
          git diff --check
      - name: Build Linux test image
        run: docker build --file Dockerfile.test --tag "$TEST_IMAGE" .
      - name: Diagnose Linux SQLite test environment
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --shm-size=1g \
            -e PYTHONPATH=/workspace -e APP_ENV=test \
            -e TMPDIR=/workspace/.pytest-tmp -e SQLITE_TMPDIR=/workspace/.pytest-tmp \
            -e SECRET_KEY=rc-readiness-synthetic-secret-key-012345678901234567890123 \
            -e ENCRYPTION_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            -v "$PWD:/workspace" -w /workspace "$TEST_IMAGE" \
            bash -Eeuc '
              python --version
              python -c "import sqlite3; print(f\"SQLite {sqlite3.sqlite_version}\")"
              echo "TMPDIR=${TMPDIR-}"
              echo "SQLITE_TMPDIR=${SQLITE_TMPDIR-}"
              echo "pytest_basetemp=/workspace/.pytest-tmp"
              df -hT /tmp /workspace
              df -i /tmp /workspace
              mount
              awk "/^(MemTotal|MemAvailable|SwapTotal|SwapFree):/ {print}" /proc/meminfo
              ulimit -a
            '
      - name: Run Phase 6 harness and classify only known SIGBUS
        id: phase6
        shell: bash
        run: |
          set -Eeuo pipefail
          phase6_log=phase6-harness.log
          status=0
          docker run --rm --shm-size=1g \
            -e PYTHONPATH=/workspace -e APP_ENV=test \
            -e TMPDIR=/workspace/.pytest-tmp -e SQLITE_TMPDIR=/workspace/.pytest-tmp \
            -e SECRET_KEY=rc-readiness-synthetic-secret-key-012345678901234567890123 \
            -e ENCRYPTION_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            -v "$PWD:/workspace" -w /workspace "$TEST_IMAGE" \
            bash -Eeuc 'pytest -vv -s --basetemp=/workspace/.pytest-tmp tests/test_phase6_cutover.py' \
            >"$phase6_log" 2>&1 || status=$?
          cat "$phase6_log"
          if [[ "$status" -eq 0 ]]; then
            echo 'result=PASS' >> "$GITHUB_OUTPUT"
            echo 'Extended Phase 6 harness: PASS' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$status" -eq 135 ]] \
            && grep -q 'Fatal Python error: Bus error' "$phase6_log" \
            && grep -q 'test_historical_sqlite_revision_is_eligible_and_upgraded_with_backup' "$phase6_log" \
            && grep -q '20260730_01_kaya_schema_baseline.py:' "$phase6_log"; then
            echo 'result=KNOWN_SIGBUS' >> "$GITHUB_OUTPUT"
            {
              echo '## Extended Phase 6 harness: FAIL - known SIGBUS'
              echo 'Known issue: Linux CI native SIGBUS in the historical Phase 6 Alembic fixture during baseline schema/index construction.'
              echo 'The test remains tracked and was not skipped or xfailed.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Unexpected Phase 6 harness failure status=$status" >&2
            exit "$status"
          fi
      - name: Run remaining pytest files
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --shm-size=1g \
            -e PYTHONPATH=/workspace -e APP_ENV=test \
            -e TMPDIR=/workspace/.pytest-tmp -e SQLITE_TMPDIR=/workspace/.pytest-tmp \
            -e SECRET_KEY=rc-readiness-synthetic-secret-key-012345678901234567890123 \
            -e ENCRYPTION_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            -v "$PWD:/workspace" -w /workspace "$TEST_IMAGE" \
            bash -Eeuc '
              mapfile -t test_files < <(find ./tests -type f -name "test_*.py" ! -name "test_phase6_cutover.py" | sort)
              ((${#test_files[@]} > 0))
              for test_file in "${test_files[@]}"; do
                echo "Running $test_file in an isolated pytest process"
                status=0
                pytest -q --basetemp=/workspace/.pytest-tmp "$test_file" || status=$?
                if [[ "$status" -ne 0 && "$status" -ne 5 ]]; then exit "$status"; fi
                if [[ "$status" -eq 5 ]]; then echo "No tests collected for $test_file"; fi
              done
            '
      - name: Report extended harness result
        if: always()
        run: |
          echo "Extended Phase 6 harness result: ${{ steps.phase6.outputs.result || 'NOT RUN' }}" >> "$GITHUB_STEP_SUMMARY"

  verdict:
    name: RC runtime readiness verdict
    if: always()
    needs: [resolve-candidate, runtime-gate, extended-harness]
    runs-on: ubuntu-latest
    steps:
      - name: Write tiered verdict
        env:
          CANDIDATE_SHA: ${{ needs.resolve-candidate.outputs.candidate_sha }}
          RUNTIME_RESULT: ${{ needs.runtime-gate.result }}
          EXTENDED_RESULT: ${{ needs.extended-harness.result }}
          PHASE6_RESULT: ${{ needs.extended-harness.outputs.phase6_result }}
        run: |
          set -Eeuo pipefail
          if [[ "$RUNTIME_RESULT" == success ]]; then
            runtime_verdict='Runtime RC readiness: READY'
          else
            runtime_verdict='Runtime RC readiness: NOT READY'
          fi
          {
            echo '## Tiered RC readiness verdict'
            echo "- Validated candidate SHA: `$CANDIDATE_SHA`"
            echo "- Tier A Runtime Release Gate: **$RUNTIME_RESULT**"
            echo "- Tier B Extended Test/Harness Gate: **$EXTENDED_RESULT**"
            echo "- Extended Phase 6 harness: **${PHASE6_RESULT:-NOT RUN}**"
            echo "- $runtime_verdict"
            echo '- Known issue: Linux CI native SIGBUS in the historical Phase 6 Alembic fixture remains unresolved and tracked separately.'
            echo '- No release, tag, RC.2 image, or latest publish was created.'
          } >> "$GITHUB_STEP_SUMMARY"
