name: Phase 9 SQLite Lifecycle Validation

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/phase9-runtime.yml"
      - "scripts/phase9_runtime_validation.sh"
      - "scripts/phase9_acceptance_evidence.py"
      - "scripts/kaya_phase6_upgrade.py"
      - "scripts/kaya_db_migrate.py"
      - "scripts/generate_sqlite_migration_fixture.py"
      - "app/db/**"
      - "app/core/config.py"
      - "docker-entrypoint.sh"
      - "install-kaya.sh"
      - "docker-compose*.yml"
      - "migrations/**"
      - "docs/sqlite-lifecycle-policy.md"
      - "tests/test_phase6_cutover.py"
  pull_request:
    paths:
      - ".github/workflows/phase9-runtime.yml"
      - "scripts/phase9_runtime_validation.sh"
      - "scripts/phase9_acceptance_evidence.py"
      - "scripts/kaya_phase6_upgrade.py"
      - "scripts/kaya_db_migrate.py"
      - "scripts/generate_sqlite_migration_fixture.py"
      - "app/db/**"
      - "app/core/config.py"
      - "docker-entrypoint.sh"
      - "install-kaya.sh"
      - "docker-compose*.yml"
      - "migrations/**"
      - "docs/sqlite-lifecycle-policy.md"
      - "tests/test_phase6_cutover.py"

jobs:
  lifecycle:
    name: Disposable Phase 9 SQLite lifecycle matrix
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PHASE9_PROJECT: kaya_phase9_${{ github.run_id }}_${{ github.run_attempt }}
      PHASE9_ROOT: ./phase9-data
      PHASE9_PORT: 18100
      PHASE9_IMAGE: kaya:phase9-${{ github.sha }}
      PHASE9_TEST_IMAGE: kaya:phase9-tests-${{ github.sha }}
      PHASE7D_PROJECT: kaya_phase9_${{ github.run_id }}_${{ github.run_attempt }}
      PHASE7D_ROOT: ./phase9-data
      PHASE7D_IMAGE: kaya:phase9-${{ github.sha }}
      PHASE7D_HTTP_PORT: 18100
      PHASE7D_GATEWAY_PORT: 18200
    steps:
      - uses: actions/checkout@v4
      - name: Build disposable images
        run: |
          docker build --file Dockerfile --tag "$PHASE9_IMAGE" .
          docker build --file Dockerfile.test --tag "$PHASE9_TEST_IMAGE" .
      - name: Validate Phase 9 lifecycle matrix
        run: bash scripts/phase9_runtime_validation.sh
      - name: Publish redacted Phase 9 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase9-acceptance-evidence
          path: |
            phase9_acceptance.json
            phase9-summary.tsv
            phase9-duration.tsv
          if-no-files-found: warn
      - name: Dispose exact Phase 9 resources
        if: always()
        run: |
          docker compose -p "${PHASE9_PROJECT}" -f docker-compose.yml -f ci/compose/docker-compose.phase7d-ci.yml down --remove-orphans
          python scripts/kaya_validation_resources.py cleanup-compose --project "${PHASE9_PROJECT}"
