# Cleanup-isolation-only overlay. It is never used for role-migration runtime tests.
services:
  kaya:
    image: ${KAYA_IMAGE:-ghcr.io/antybubbs/kaya:latest}
    container_name: ${PHASE12A_PROJECT:?PHASE12A_PROJECT is required}_kaya
    ports: !override []
    volumes: !override
      - type: bind
        source: ${PHASE12A_ROOT:?PHASE12A_ROOT is required}/data
        target: /app/data
      - type: bind
        source: ${PHASE12A_ROOT}/uploads
        target: /app/uploads
      - type: volume
        source: postgres_secret
        target: /run/kaya-secrets
    labels:
      com.kaya.validation.phase: "12a"
      com.kaya.validation.disposable: "true"

  secure-send-gateway:
    image: ${KAYA_IMAGE:-ghcr.io/antybubbs/kaya:latest}
    container_name: ${PHASE12A_PROJECT}_secure_send
    ports: !override []
    volumes: !override
      - type: bind
        source: ${PHASE12A_ROOT}/data
        target: /app/data
      - type: volume
        source: postgres_secret
        target: /run/kaya-secrets
        read_only: true
    labels:
      com.kaya.validation.phase: "12a"
      com.kaya.validation.disposable: "true"

  guacd:
    container_name: ${PHASE12A_PROJECT}_guacd
    labels:
      com.kaya.validation.phase: "12a"
      com.kaya.validation.disposable: "true"

  postgres-secret-init:
    image: ${KAYA_IMAGE:-ghcr.io/antybubbs/kaya:latest}
    volumes: !override
      - type: volume
        source: postgres_secret
        target: /run/kaya-secrets
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql/data
        read_only: true
      - type: bind
        source: ${PHASE12A_ROOT}/secrets
        target: /run/kaya-host-secrets
        read_only: true
    labels:
      com.kaya.validation.phase: "12a"
      com.kaya.validation.disposable: "true"

  postgres:
    image: ${PHASE12A_POSTGRES_IMAGE:-postgres:16.14}
    volumes: !override
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql/data
      - type: volume
        source: postgres_secret
        target: /run/kaya-secrets
        read_only: true
      - type: bind
        source: ${PHASE12A_ROOT}/backups
        target: /var/backups/kaya-postgres
    labels:
      com.kaya.validation.phase: "12a"
      com.kaya.validation.disposable: "true"

  postgres-role-migration-backup:
    image: ${PHASE12A_POSTGRES_IMAGE:-postgres:16.14}
    volumes: !override
      - type: volume
        source: postgres_secret
        target: /run/kaya-secrets
        read_only: true
      - type: bind
        source: ${PHASE12A_ROOT}/backups
        target: /var/backups/kaya-postgres
    labels:
      com.kaya.validation.phase: "12a"
      com.kaya.validation.disposable: "true"

  postgres-role-init:
    image: ${KAYA_IMAGE:-ghcr.io/antybubbs/kaya:latest}
    volumes: !override
      - type: volume
        source: postgres_secret
        target: /run/kaya-secrets
        read_only: true
      - type: bind
        source: ${PHASE12A_ROOT}/backups
        target: /var/backups/kaya-postgres
        read_only: true
    labels:
      com.kaya.validation.phase: "12a"
      com.kaya.validation.disposable: "true"

volumes:
  postgres_data:
    name: ${PHASE12A_PROJECT}_postgres_data
    labels:
      com.kaya.validation.phase: "12a"
      com.kaya.validation.disposable: "true"
  postgres_secret:
    name: ${PHASE12A_PROJECT}_postgres_secret
    labels:
      com.kaya.validation.phase: "12a"
      com.kaya.validation.disposable: "true"

networks:
  default:
    labels:
      com.kaya.validation.phase: "12a"
      com.kaya.validation.disposable: "true"
